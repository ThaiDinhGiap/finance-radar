server:
  port: ${PORT:8080}
  shutdown: graceful
spring:
  application:
    name: finance-radar
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:55432/finance_radar}
    username: ${DB_USER:radar}
    password: ${DB_PASSWORD:radar_local_only}
    hikari:
      maximum-pool-size: 8
  flyway:
    enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
radar:
  scheduler-enabled: ${RADAR_SCHEDULER_ENABLED:true}
  user-agent: ${RADAR_USER_AGENT:FinanceRadar/1.0}
  ai:
    api-key: ${OPENROUTER_API_KEY:}
    model: ${RADAR_AI_MODEL:inclusionai/ling-3.0-flash-vl:free}
    minimum-similarity: ${RADAR_RAG_MIN_SIMILARITY:0.3}
